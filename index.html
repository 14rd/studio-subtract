    /* ===================== SMOOTH SCROLL ===================== */
    function SmoothScroll({ children, scrollKey }) {
      var containerRef = useRef(null);
      var contentRef = useRef(null);
      var scrollTarget = useRef(0);
      var scrollCurrent = useRef(0);
      var rafId = useRef(null);

        var h = await hashCredentials(user.trim().toLowerCase(), pass);

          onAuth();
        } else {
          as.count++;

          setAttemptState(as);
          setLoading(false);
          setErr(as.count >= MAX_ATTEMPTS ? "Too many attempts. Try again later." : "Invalid credentials.");
          setLocked(as.count >= MAX_ATTEMPTS);
        }
      };

          </div>
        );

        if (section === "team") return (
          <div style={{ animation: "fadeIn 0.4s" }}>
            <h2 style={headingStyle}>Team & Contacts</h2>
            <div style={{ marginBottom: 32 }}>
              <div style={labelStyle}>Studio Subtract</div>
              {d.team.studio.map(function(m, i) { return (
                <div key={i} style={cardStyle}>
                  <div style={{ fontSize: 14, color: "var(--fg)" }}>{m.name}</div>
                  <div style={metaStyle}>{m.role} · {m.timezone}</div>
                </div>
              ); })}
            </div>
            <div>
              <div style={labelStyle}>Client Team</div>
              {d.team.client.map(function(m, i) { return (
                <div key={i} style={cardStyle}>
                  <div style={{ fontSize: 14, color: "var(--fg)" }}>{m.name}</div>
                  <div style={metaStyle}>{m.role} · {m.timezone}</div>
                </div>
              ); })}
            </div>
          </div>
        );

        if (section === "archive") return (
          <div style={{ animation: "fadeIn 0.4s" }}>
            <h2 style={headingStyle}>Archive</h2>
            <div style={{ fontSize: 13, color: "var(--fg-dim)", lineHeight: 1.55, textAlign: "center", padding: "60px 0" }}>
              No archived engagements yet.
            </div>
          </div>
        );

        if (section === "artifact") return (
          <div style={{ animation: "fadeIn 0.4s" }}>
            <h2 style={headingStyle}>Annual Artifact</h2>
            <div style={{ textAlign: "center", padding: "60px 0" }}>
              <div style={{ fontSize: 13, color: "var(--fg-dim)", lineHeight: 1.55, marginBottom: 8 }}>
                Once a year, Studio Subtract releases a limited edition artifact.
              </div>
              <div style={{ fontSize: 13, color: "var(--fg-dim)", lineHeight: 1.55 }}>
                As a client, you'll be the first to receive it.
              </div>
            </div>
          </div>
        );

        return null;
      };

      return (
        <div style={{ position: "fixed", inset: 0, background: "var(--bg)", zIndex: 5,
          animation: "slideIn 0.6s cubic-bezier(.2,.7,.2,1)" }}>
          {/* Mobile menu toggle */}
          {mobile && (
            <button onClick={function() { setMenuOpen(!menuOpen); }}
              style={{ position: "fixed", top: 20, left: 16, zIndex: 60, background: "none", border: "none",
                fontSize: 11, color: "var(--fg-dim)", fontFamily: "var(--sans)", cursor: "pointer",
                letterSpacing: "-0.01em" }}>
              {menuOpen ? "Close" : "Menu"}
            </button>
          )}
          <button onClick={onLogout}
            style={{ position: "fixed", top: mobile ? 20 : 24, right: mobile ? 16 : 32, zIndex: 60,
              background: "none", border: "none", fontSize: 11, color: "var(--fg-dim)", fontFamily: "var(--sans)",
              cursor: "pointer", letterSpacing: "-0.01em" }}>Logout</button>

          <div style={{ display: "flex", height: "100%", paddingTop: mobile ? 56 : 0 }}>
            {/* Sidebar */}
            {(!mobile || menuOpen) && (
              <div style={{
                width: mobile ? "100%" : sidebarW, minWidth: mobile ? "100%" : sidebarW,
                borderRight: mobile ? "none" : "1px solid var(--line)",
                padding: mobile ? "20px 24px" : "32px 24px",
                position: mobile ? "fixed" : "relative",
                inset: mobile ? 0 : "auto", top: mobile ? 56 : 0,
                background: "var(--bg)", zIndex: mobile ? 55 : "auto",
                overflowY: "auto" }}>
                <div style={{ fontSize: 11, fontWeight: 400, letterSpacing: "-0.01em",
                  color: "var(--fg-dim)", marginBottom: 24, paddingTop: mobile ? 0 : 24 }}>Portal</div>
                {PORTAL_SECTIONS.map(function(s) { return (
                  <div key={s.id} onClick={function() { setSection(s.id); if (mobile) setMenuOpen(false); }}
                    style={{ fontSize: 13, color: section === s.id ? "var(--fg)" : "var(--fg-dim)",
                      padding: "8px 0", cursor: "pointer", transition: "color 0.2s",
                      textDecoration: section === s.id ? "underline" : "none",
                      textUnderlineOffset: "4px" }}>{s.label}</div>
                ); })}
              </div>
            )}
            {/* Content */}
            <div style={{ flex: 1, overflowY: "auto", padding: mobile ? "24px 20px 80px" : "56px 48px 80px",
              maxWidth: 720 }}>
              {renderContent()}
            </div>
          </div>
        </div>
      );
    }

    /* ===================== PORTAL PAGE ===================== */
    function PortalPage({ onHideNav }) {
      var stAuthed = useState(function() { return sessionStorage.getItem("_pauth") === "1"; });
      var authed = stAuthed[0], setAuthed = stAuthed[1];
      useEffect(function() { onHideNav(authed); }, [authed]);
      if (!authed) return <PortalLogin onAuth={function() { setAuthed(true); }} />;
      return <PortalDashboard onLogout={function() { sessionStorage.removeItem("_pauth"); setAuthed(false); }} />;
    }

    /* ===================== APP ===================== */
    function App() {
      var route = useRoute();
      var stI = useState(false); var introDone = stI[0], setIntroDone = stI[1];
      var stPortalAuthed = useState(false); var portalAuthed = stPortalAuthed[0], setPortalAuthed = stPortalAuthed[1];

      useEffect(function() {
        if (route.page !== "works" || route.slug) setIntroDone(true);
      }, []);

      var handleNav = function(p) { navigate("/" + p); };

      useEffect(function() {
        if (route.page === "studio") document.title = "Studio - Studio Subtract";
        else if (route.page === "contact") document.title = "Contact - Studio Subtract";
        else if (route.page === "portal") document.title = "Portal - Studio Subtract";
        else if (route.page === "register") document.title = "Register - Studio Subtract";
        else document.title = "Studio Subtract";
      }, [route]);

      var showNav = route.page !== "register" && !(route.page === "portal" && portalAuthed);

      return (
        <>
          {!introDone && route.page !== "register" && <IntroOverlay onDone={function() { setIntroDone(true); }} />}
          {showNav && <Nav onNav={handleNav} page={route.page} />}
          {route.page === "works" && <Gallery items={window.GALLERY_ITEMS} introDone={introDone} />}
          {route.page === "studio" && <StudioPage />}
          {route.page === "contact" && <ContactPage />}
          {route.page === "portal" && <PortalPage onHideNav={setPortalAuthed} />}
          {route.page === "register" && <RegisterPage />}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
